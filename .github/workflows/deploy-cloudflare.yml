name: Test and deploy to Cloudflare Pages
# Runs on pull requests (checks only) and on every push to main, i.e. when a PR
# is merged (checks + deploy). It can also be started by hand from the Actions tab.
# The deploy needs two repository secrets: CLOUDFLARE_API_TOKEN (Pages: Edit)
# and CLOUDFLARE_ACCOUNT_ID. Without them the checks still run and the deploy
# step is skipped. GitHub Pages serves the committed root build separately.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      deployments: write
    defaults:
      run:
        working-directory: app
    env:
      HAS_CF: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci --legacy-peer-deps
      - name: Typecheck
        run: npm run typecheck
      - name: Tests and validators
        run: npm run validate
      - run: npm run build
      # Installed copies of earlier versions still ask for their own files; keep
      # them available (never overwriting this build's).
      - name: Keep earlier versions' files
        run: cp -rn ../assets/. dist/assets/
      - name: Deploy to Cloudflare Pages
        if: env.HAS_CF == 'true' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: app
          command: pages deploy dist --project-name=mystique-compass --branch=main
